# Grafana 看板预置（P7-Dep1）
# 首次启动自动导入 providers 指向的看板 JSON。
apiVersion: 1

providers:
  - name: "KnowAgent 预置看板"
    orgId: 1
    folder: "KnowAgent"
    type: file
    disableDeletion: true   # 禁止在 UI 里误删
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
