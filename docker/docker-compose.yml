# 知识库问答网站 — P1 本地编排（P1-Dep1 Docker Compose）
# 拓扑：nginx(80) 托管前端静态 + 反代 /api → backend(8000) ↔ postgres(5432)
# 与《需求清单》第四节一致：P1 仅需 nginx + backend + PostgreSQL 三件套。
#
# 用法（在本文件所在目录执行）：
#   docker compose up --build          # 构建并前台启动（日志同屏）
#   docker compose up -d --build       # 后台启动
#   docker compose ps                  # 查看容器状态
#   docker compose down                # 停止并移除容器（保留数据卷）
#   docker compose down -v             # 同时删除数据卷（清空数据库与上传文件）
#   docker compose logs -f backend     # 跟踪后端日志
#
# 环境变量：本目录 .env（可选，见 .env.example）注入 DEEPSEEK_API_KEY。
#   docker compose 会自动读取同目录 .env 作为变量源，供 ${...} 占位符替换。

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:16-alpine
    environment:
      # 与 backend DATABASE_URL 保持一致（postgres 镜像会据此自动建库建用户）
      POSTGRES_USER: knowagent
      POSTGRES_PASSWORD: knowagent
      POSTGRES_DB: knowagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅本地调试用（便于 psql 直连）；生产可删除此映射
      - "5432:5432"
    healthcheck:
      # pg_isready 随 postgres 镜像自带；就绪后才允许 backend 启动
      test: ["CMD-SHELL", "pg_isready -U knowagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- 缓存 / 消息队列（P3-Dep1 引入，P5 复用） ----------
  # 作用：① Celery broker/result backend（文档与媒体入库）；② 检索结果缓存（db2）
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      # 仅本地调试用；生产可删除，容器间走服务名 redis
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 后端 FastAPI ----------
  backend:
    build: ../backend
    environment:
      # 容器内环境：关闭热重载（RELOAD=false），保留开发文档便于联调
      APP_ENV: development
      RELOAD: "false"
      # 数据库连接：host 指向 compose 服务名 postgres（非 localhost）
      DATABASE_URL: postgresql+asyncpg://knowagent:knowagent@postgres:5432/knowagent
      # 文档上传：本地存储后端 + 挂载卷（对象存储 MinIO 在 P3 引入）
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/uploads
      # CORS：浏览器同源经 nginx 访问；兜底放通 localhost
      CORS_ORIGINS: http://localhost
      DEEPSEEK_MODEL: deepseek-flash
      LOG_LEVEL: INFO
      # DeepSeek Key：由宿主机 .env 注入（见 .env.example）；
      # 缺省为空 → 服务可起但 /chat 返回「未配置」提示，不影响上传与页面。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ---- P3/P5：Celery（容器内必须指向服务名 redis，不能是 localhost）----
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      USE_CELERY: "true"
      CELERY_MEDIA_QUEUE: media
      # ---- P3/P5：向量与多模态（Key 由宿主机 .env 注入）----
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      MEDIA_OCR_MODEL: ${MEDIA_OCR_MODEL:-qwen3.5-ocr}
      MEDIA_ASR_MODEL: ${MEDIA_ASR_MODEL:-qwen3.8-omni-flash}
      MEDIA_EXTRACT_ENABLED: "true"
      # ---- P7：结构化日志 / 错误上报 ----
      LOG_FORMAT: json
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # ---- P7：LLM 限流与配额 ----
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_RATE_LIMIT_PER_DAY: ${LLM_RATE_LIMIT_PER_DAY:-300}
      LLM_DAILY_TOKEN_QUOTA: ${LLM_DAILY_TOKEN_QUOTA:-200000}
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      # ---- P7：监控指标 ----
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # ---- P7：数据不出域（私有化 strict / 公有云 standard）----
      DATA_RESIDENCY_MODE: ${DATA_RESIDENCY_MODE:-standard}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
      # ---- P7：审计日志 ----
      AUDIT_ENABLED: "true"
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      # ---- P7：备份（应用内置 Celery beat 触发；容器化另配 backup 容器）----
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /app/data/backups
    volumes:
      - uploads:/app/data/uploads
      - backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 便于直接调试后端；生产可删除，仅经 nginx 访问
      - "8000:8000"
    healthcheck:
      # 用镜像内 Python 探活 /health（slim 镜像无 curl/wget）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 文档入库 worker（默认队列） ----------
  # 与 backend 共用镜像，只覆盖 entrypoint 为 celery worker。
  # -Q celery：只消费默认队列，避免与媒体 worker 抢任务。
  worker:
    build: ../backend
    entrypoint: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "celery", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://knowagent:knowagent@postgres:5432/knowagent
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      LOG_LEVEL: INFO
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 媒体入库 worker（P5-Dep1：独立/可扩容） ----------
  # 为什么单独一个服务：
  #   OCR/ASR 需要把音视频转码（CPU 密集）并调用多模态模型（长耗时），
  #   与普通文档入库放在同一 worker 会让「刚上传的 Word」排在长视频后面。
  #   -c 1：一次只处理一个媒体任务，避免多个转码互相抢 CPU；
  #   需要吞吐时横向扩容：docker compose up -d --scale media-worker=3。
  media-worker:
    build: ../backend
    entrypoint: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "info", "-Q", "media", "-c", "1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://knowagent:knowagent@postgres:5432/knowagent
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/data/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}
      MEDIA_EXTRACT_ENABLED: "true"
      MEDIA_OCR_MODEL: ${MEDIA_OCR_MODEL:-qwen3.5-ocr}
      MEDIA_ASR_MODEL: ${MEDIA_ASR_MODEL:-qwen3.8-omni-flash}
      LOG_LEVEL: INFO
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 前端（nginx 托管 + 反代） ----------
  nginx:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    # 前端静态资源已烤进镜像（多阶段构建），无需挂卷

volumes:
  pgdata:
  uploads:
  # Redis AOF 持久化卷（Celery 队列与检索缓存）
  redisdata:
  # 备份产物卷（与 backup 容器 / 应用内置备份共享）
  backups:
