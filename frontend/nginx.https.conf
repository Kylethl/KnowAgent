# 知识库问答网站 — 生产 HTTPS 配置（P2-Dep1：nginx + Let's Encrypt）
# ---------------------------------------------------------------------
# 用途：上线时替换镜像内的 frontend/nginx.conf（HTTP 版），实现：
#   1) 80 端口：保留 Let's Encrypt 的 HTTP-01 校验路径，其余请求 301 跳 HTTPS；
#   2) 443 端口：TLS 终止 + 托管前端静态资源 + 反代 /api 到后端。
#
# 与本地开发版（nginx.conf，纯 HTTP）的分工：
#   - nginx.conf        ：本地 docker compose up 直接用，无需证书；
#   - nginx.https.conf  ：生产用，由 docker-compose.https.yml 覆盖挂载。
#
# 证书路径约定（重要）：
#   固定用 /etc/letsencrypt/live/knowagent/ 这一路径，与域名解耦——
#   签发时指定 --cert-name knowagent，certbot 就会把证书放在该固定目录，
#   这样本文件不用为每个部署环境改域名。
#
# 首次签发证书（在服务器执行一次，把域名换成自己的）：
#   docker compose -f docker-compose.yml -f docker-compose.https.yml run --rm certbot \
#     certbot certonly --webroot -w /var/www/certbot \
#     --cert-name knowagent \
#     -d your.domain.com \
#     --email you@example.com --agree-tos --no-eff-email
#   签发成功后再启动 nginx（否则 nginx 找不到证书会启动失败）。
#
# 自动续期：docker-compose.https.yml 中的 certbot 服务每 12 小时尝试续期一次；
#          续期后需让 nginx 重新加载证书，见该文件注释中的 reload 命令。

# ---------- HTTP(80)：ACME 校验 + 全站跳转 HTTPS ----------
server {
    listen 80;
    # 上线前可替换为真实域名（多域名用空格分隔）；保留 _ 表示兜底匹配所有 Host
    server_name _;

    # Let's Encrypt HTTP-01 校验路径：必须走明文 HTTP 且不能被跳转，
    # 否则续期会失败。certbot 用 --webroot 把校验文件写到 /var/www/certbot。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余所有请求统一跳转 HTTPS（P2-Dep1「开启 HTTPS」的核心）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS(443)：主站 ----------
server {
    listen 443 ssl;
    # nginx 1.25+ 用 http2 on;（旧版本为 listen 443 ssl http2;）
    http2 on;
    server_name _;

    # Let's Encrypt 签发的证书与私钥（cert-name=knowagent 保证路径固定）
    ssl_certificate     /etc/letsencrypt/live/knowagent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowagent/privkey.pem;

    # ---------- TLS 加固 ----------
    # 只启用 TLS 1.2/1.3（TLS 1.0/1.1 已不安全）
    ssl_protocols TLSv1.2 TLSv1.3;
    # 让客户端优先选择更安全的套件
    ssl_prefer_server_ciphers off;
    # 会话复用缓存，减少重复握手开销
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话票据关闭（降低密钥长期泄露带来的历史流量解密风险）
    ssl_session_tickets off;

    # HSTS：告知浏览器后续只走 HTTPS（上线确认无误后再启用，含子域需谨慎）
    # 说明：max-age 设 6 个月；若需覆盖子域可加 includeSubDomains。
    add_header Strict-Transport-Security "max-age=15768000" always;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：非文件请求都回退到 index.html（P2-F2 引入 /login 路由后必须，
    # 否则直接访问 /login 刷新会 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 反代 /api → 后端 FastAPI ----------
    # 例如：/api/chat → http://backend:8000/chat
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 明确告知后端「用户侧是 HTTPS」，便于后续生成正确的绝对 URL
        proxy_set_header X-Forwarded-Proto https;

        # SSE 流式（打字机效果）必需：关闭缓冲与缓存，保证分片实时下发
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;

        # 文档上传体积较大（≤20MB），放宽客户端请求体上限避免 413
        client_max_body_size 50m;
    }
}
