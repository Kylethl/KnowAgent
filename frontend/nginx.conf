# 知识库问答网站 — 前端托管 + API 反代配置（P1-Dep1）
# 镜像基于 nginx:alpine，主配置 /etc/nginx/nginx.conf 已包含 events/http 块，
# 并 include /etc/nginx/conf.d/*.conf，故此处仅写 server 块即可。

# 访问日志格式（P7-Dep1：结构化 nginx 日志，供 Promtail/Loki 或 ELK 采集）
# 说明：默认 combined 格式缺 request_id 与耗时；这里扩展出可解析的 JSON 日志。
#   $request_id 来自上游 backend 回传的 X-Request-ID 响应头（中间件生成），
#   配合后端结构化日志可按 request_id 串起「nginx 一条 ↔ 后端 N 条」完整链路。
log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request_method $request_uri","status":$status,'
    '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":$upstream_response_time,'
    '"http_referer":"$http_referer","http_user_agent":"$http_user_agent",'
    '"request_id":"$upstream_http_x_request_id"}';

server {
    listen 80;
    server_name _;

    # P7-Dep1：访问日志写到 stdout（容器日志驱动采集），格式为 JSON
    access_log /var/log/nginx/access.log json_combined;

    # 前端静态资源根目录（多阶段构建 COPY 进来的 dist）
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：非文件请求都回退到 index.html（刷新 / 直链不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代 /api → 后端 FastAPI（剥离 /api 前缀，见《需求清单》第四节「nginx 反代 /api」）
    # 例如：/api/chat → http://backend:8000/chat
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式（打字机效果）必需：关闭缓冲与缓存，保证分片实时下发
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;

        # 文档上传体积较大（≤20MB），放宽客户端请求体上限避免 413
        client_max_body_size 50m;
    }
}
