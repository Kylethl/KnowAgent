# KnowAgent 后端 Conda 环境（环境隔离：专用环境 knowAgent，Python 3.11）
#
# 创建/更新：
#   conda env create -f environment.yml        # 首次创建
#   conda env update -f environment.yml --prune  # 依赖变更后同步
# 激活：
#   conda activate knowAgent
#
# 说明：conda 源中已覆盖的包放 conda 段，其余（FastAPI 生态）走 pip 段；
#       两侧版本需与 requirements.txt 保持一致。

name: knowAgent
channels:
  - conda-forge
  - defaults
dependencies:
  # ---------- conda 段 ----------
  - python=3.11
  - pip>=23.3
  # ---------- pip 段（conda 源缺失或版本滞后的包） ----------
  - pip:
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.30.0
      - pydantic>=2.7.0
      - pydantic-settings>=2.3.0
      - python-dotenv>=1.0.0
      - httpx>=0.27.0
      # 表单 / 文件上传解析（/documents/upload 必需）
      - python-multipart>=0.0.9
      # LangChain 生态（P1-A1）：封装 DeepSeek 调用链 + 会话记忆
      - langchain>=1.0,<2
      - langchain-core>=1.0,<2
      - langchain-deepseek>=1.0,<2
      # 数据库（P1-DB1 起）：PostgreSQL 异步 ORM
      - sqlalchemy>=2.0,<3
      - asyncpg>=0.29.0
      # 用户鉴权（P2-B2）：JWT 令牌签发校验 + bcrypt 密码哈希
      - PyJWT>=2.8,<3
      - bcrypt>=4.0.1
      # 对象存储（P1-B2）：MinIO / S3 兼容 SDK（minio 后端使用，懒导入）
      - minio>=7.2.0
      # 文档解析（P3-B1 管理员预览 / P3-A1 入库切片）：读取 .docx 文本
      - python-docx>=1.1.0
      # 检索缓存（P4-DB1）：redis.asyncio 缓存检索结果（不可用时自动回退内存缓存）
      - redis>=5.0
      # 多模态（P5）：图片送 OCR 前压缩；imageio-ffmpeg 附带静态 ffmpeg 用于视频提音轨/音频切片
      - Pillow>=10.0.0
      - imageio-ffmpeg>=0.5.0
      # 监控与错误上报（P7）：Prometheus 指标 + Sentry 异常上报（均为可选依赖，缺失时自动降级）
      - prometheus-client>=0.20
      - sentry-sdk[fastapi]>=2.0

